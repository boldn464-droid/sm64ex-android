name: Build Single Player SM64 APK
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-20.04 # Uses an older server image for better retro compatibility
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Legacy Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8' # Swapped from 17 to 8 to match the old project settings

      - name: Setup Android SDK Dependencies
        uses: android-actions/setup-android@v3

      - name: Setup Retro NDK Component
        run: |
          sdkmanager --install "ndk;21.4.7075529" # Uses older NDK version required by sm64ex code

      - name: Extract Base Game Assets
        run: |
          ./getSDL.sh || true
          mkdir -p app/jni/src
          echo "Preparing legacy workspace..."

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Compile Standalone Native APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Export Output Artifact to GitHub UI
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-singleplayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
